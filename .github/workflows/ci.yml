name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify production entrypoint
        run: node -e "const fs=require('node:fs'); if (!fs.existsSync('dist/index.html')) throw new Error('dist/index.html is missing after build');"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
